name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only place where the EventKit adapter is compiled for real
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices up to date
        if: runner.os == 'Linux'
        run: make check-notices
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: CalDAV end-to-end tests
        if: runner.os == 'Linux'
        run: make test-caldav
      # The menu bar app; on Linux only its display-free parts and a stub main compile
      - name: Clippy (ui)
        run: cargo clippy --locked --all-targets --features ui -- -D warnings
      - name: Test (ui)
        run: cargo test --locked --features ui --bin capycal-ui

  gtk:
    name: Linux app
    runs-on: ubuntu-24.04
    # The oldest GTK 4 and libadwaita the app supports, like the release
    container: debian:13
    steps:
      - name: Install GTK 4 and libadwaita
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libadwaita-1-dev libgtk-4-dev pkg-config
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (GTK app)
        run: cargo clippy --locked --features gtk --bin capycal-app --tests -- -D warnings
      - name: Test (GTK app)
        run: cargo test --locked --features gtk --bin capycal-app
