name: E2E servers

# The CalDAV end-to-end tests against Stalwart and Nextcloud, next to the
# Radicale run of every CI job, and the JMAP ones against Stalwart. Only where a change can matter to a server, and
# called by the release workflow.
on:
  push:
    branches: [main]
    paths:
      - "src/caldav/**"
      - "src/ical/**"
      - "src/ics/**"
      - "src/jmap/**"
      - "src/sync/**"
      - "tests/caldav_e2e.rs"
      - "tests/jmap_e2e.rs"
      - "scripts/test-caldav.sh"
      - ".github/workflows/e2e-servers.yml"
  pull_request:
    paths:
      - "src/caldav/**"
      - "src/ical/**"
      - "src/ics/**"
      - "src/jmap/**"
      - "src/sync/**"
      - "tests/caldav_e2e.rs"
      - "tests/jmap_e2e.rs"
      - "scripts/test-caldav.sh"
      - ".github/workflows/e2e-servers.yml"
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stalwart
            target: test-caldav SERVER=stalwart
          - name: nextcloud
            target: test-caldav SERVER=nextcloud
          - name: stalwart-jmap
            target: test-jmap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: End-to-end tests
        run: make ${{ matrix.target }}
