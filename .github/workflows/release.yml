name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload artifacts but do not publish a release
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install packaging tools
        if: contains(matrix.target, 'linux')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="capycal-${GITHUB_REF_NAME//\//-}-${TARGET}"
          if [[ "$TARGET" == *linux* ]]; then
            # Tarball with man page, completions and units, plus .deb and .rpm
            packaging/linux/build-packages.sh "$TARGET" "$name"
          else
            mkdir -p "dist/$name"
            cp "target/$TARGET/release/capycal" README.md LICENSE CONTRIBUTORS.md THIRD-PARTY-NOTICES.txt capycal.example.toml "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  app:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app

      - name: Test
        run: cargo test --locked --features ui --bin capycal-ui

      - name: Build app
        run: packaging/macos/build-app.sh

      - name: Build disk image
        id: package
        run: |
          name="capycal-${GITHUB_REF_NAME//\//-}-macos"
          packaging/macos/build-dmg.sh target/macos/Capycal.app "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  gtk:
    name: Linux app ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Debian 13's GTK 4.18 and libadwaita 1.7 are the oldest the app
    # supports, its glibc the oldest among the systems that have them
    container: debian:13
    steps:
      - name: Install GTK 4 and libadwaita
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates curl git libadwaita-1-dev libgtk-4-dev pkg-config

      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: gtk-${{ matrix.target }}

      - name: Test
        run: cargo test --locked --features gtk --bin capycal-app

      - name: Build
        run: cargo build --release --locked --features gtk --bin capycal-app --target ${{ matrix.target }}

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package
        run: packaging/linux/build-app-packages.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: capycal-app-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  # The bundle installs from a download and updates from the Flatpak
  # repository on capycal.app, which the website builds from these bundles
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/linux/flatpak/*', 'Cargo.lock') }}
          restore-keys: flatpak-${{ matrix.arch }}-

      - name: Build
        run: packaging/linux/build-flatpak.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          if-no-files-found: error

  # Every package ships THIRD-PARTY-NOTICES.txt as committed: refuse to
  # release a stale one
  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices up to date
        run: make check-notices

  release:
    needs: [build, app, gtk, flatpak, notices]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Fine-grained token with write access to twiebe/homebrew-capycal; without
      # it the formula and cask are only attached to the release
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Private SSH key of the AUR account that maintains capycal-bin and
      # capycal-app-bin; without it the PKGBUILDs are only attached to the release
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      # The token the docs workflow uses to trigger the website build
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
      # Only the step that signs gets the key itself
      HAS_PACKAGES_KEY: ${{ secrets.PACKAGES_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # With the key of the package repositories: dnf and PackageKit check
      # each rpm against it. Unsigned rpms stay out of the repository.
      - name: Sign the rpms
        if: env.HAS_PACKAGES_KEY == 'true'
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          packaging/linux/sign-rpms.sh dist
      - name: Write the AUR PKGBUILDs
        run: packaging/linux/aur/make-pkgbuild.sh dist dist
      - name: Write the Homebrew formula and cask
        run: packaging/homebrew/make-homebrew.sh dist dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout may keep only a lightweight tag: fetch the annotated
          # one, whose message opens the release notes
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # The whole message: git's "subject" is the first paragraph joined
          # into one line, which would run a heading and its list together
          git for-each-ref --format='%(contents)' \
            "refs/tags/$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
      # The Pages workflow of the website rebuilds the APT and RPM repositories
      # from the newest releases
      - name: Update the package repositories
        if: env.WEBSITE_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WEBSITE_DISPATCH_TOKEN }}
        run: gh api repos/twiebe/capycal-web/dispatches -f event_type=release
      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/twiebe/homebrew-capycal.git" tap
          mkdir -p tap/Formula tap/Casks
          cp dist/capycal.rb tap/Formula/
          cp dist/capycal-app.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git commit -m "capycal $GITHUB_REF_NAME"
          git push
      - name: Update the AUR packages
        if: env.AUR_SSH_KEY != ''
        run: packaging/linux/aur/publish.sh dist

  # Not yet in the needs of release: the release waits for it once it proved stable
  e2e-servers:
    uses: ./.github/workflows/e2e-servers.yml

  # Once the release is out, its Linux binaries become the container image
  image:
    needs: [release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
