name: Image

# The CLI as ghcr.io/twiebe/capycal for linux/amd64 and linux/arm64, from the
# musl tarballs of a published release. The release workflow calls it; run it
# by hand to build the image of an existing release:
#   gh workflow run image.yml -f tag=v0.2.0
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      latest:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.2.0
        type: string
        required: true
      latest:
        description: Also tag it as latest (off for an older release)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      # The Dockerfile of this workflow's commit, so older releases get one too
      - uses: actions/checkout@v7
      - name: Download the release's Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*-unknown-linux-musl.tar.gz' \
            --pattern '*-unknown-linux-musl.tar.gz.sha256'
          (cd dist && sha256sum -c ./*.sha256)
      - name: Stage the binaries and notices
        run: |
          mkdir -p dist/image
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            mkdir -p "dist/image/$arch"
            tar -xzf dist/capycal-*-"${pair#*:}"-unknown-linux-musl.tar.gz -C "dist/image/$arch" --strip-components=1
          done
          cp dist/image/amd64/{LICENSE,CONTRIBUTORS.md,THIRD-PARTY-NOTICES.txt} dist/image/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 0.2.1, 0.2 and latest
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          flavor: |
            latest=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.title=capycal
            org.opencontainers.image.description=Calendar sync that knows how to keep a secret
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ inputs.tag }}
      - uses: docker/build-push-action@v7
        with:
          context: dist/image
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
