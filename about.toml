# Licenses of the crates compiled into Capycal's binaries, for
# THIRD-PARTY-NOTICES.txt (`make notices`). A dependency under a license not
# listed here fails the check: decide before adding it.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Capycal itself; its license is LICENSE, the template leaves it out
[capycal]
accepted = ["GPL-3.0-only"]
